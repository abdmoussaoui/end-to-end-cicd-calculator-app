name: Calculator CI/CD

on:
  push:
    branches:
      - main
      - master

jobs:
  build-test-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker images
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/calculator-app:latest
            ${{ secrets.DOCKER_USERNAME }}/calculator-app:${{ github.sha }}

      - name: Deploy to Kubernetes on AWS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.MASTER_PUBLIC_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo kubectl set image deployment/calculator-app calculator-app=${{ secrets.DOCKER_USERNAME }}/calculator-app:${{ github.sha }}
            sudo kubectl rollout status deployment/calculator-app --timeout=180s
            sudo kubectl get pods
